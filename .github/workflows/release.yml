name: Release Gateway

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  release:
    name: Build and publish gateway
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Test
        run: dotnet test tests\DoorMonitor.Core.Tests\DoorMonitor.Core.Tests.csproj -c Release

      - name: Publish and package
        shell: pwsh
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          $root = $env:GITHUB_WORKSPACE
          $tag = $env:TAG_NAME
          $version = $tag.TrimStart('v')
          $safeTag = $tag -replace '[^0-9A-Za-z._-]', '-'
          $assetBase = "DoorMonitor.Gateway-$safeTag-win-x64"

          $releaseDir = Join-Path $root 'release'
          $publishDir = Join-Path $releaseDir 'publish'
          $stageDir = Join-Path $releaseDir 'stage'
          $zipPath = Join-Path $releaseDir "$assetBase.zip"
          $checksumPath = Join-Path $releaseDir "$assetBase.sha256"

          Remove-Item -Recurse -Force $releaseDir -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path $publishDir, $stageDir | Out-Null

          $publishArgs = @(
            'publish',
            'src\DoorMonitor.Gateway',
            '-p:PublishProfile=win-x64',
            '-p:DebugType=None',
            '-p:DebugSymbols=false',
            '-o', $publishDir
          )

          if ($version -match '^\d+\.\d+\.\d+(\.\d+)?$') {
            $publishArgs += "-p:Version=$version"
          }
          else {
            Write-Warning "タグ '$tag' は vX.Y.Z 形式ではないため、アセンブリのバージョンは既定値になります。"
          }

          dotnet @publishArgs
          if ($LASTEXITCODE -ne 0) {
            throw 'dotnet publish に失敗しました。'
          }

          Copy-Item -Path (Join-Path $publishDir '*') -Destination $stageDir
          Copy-Item -Path (Join-Path $root 'LICENSE') -Destination $stageDir

          $readme = @"
          DoorMonitor Gateway $tag

          Windows 10/11 (x64) 用のゲートウェイアプリです。

          1. DoorMonitor.Gateway.exe を実行します。
          2. タスクトレイの「設定...」で API ベース URL と API キーを設定します。
          3. 設定は %LOCALAPPDATA%\DoorMonitor\gateway.settings.json に保存されます。

          署名なしの exe のため、SmartScreen の警告が表示される場合があります。
          "@
          $readme | Set-Content -Path (Join-Path $stageDir 'README.txt') -Encoding utf8

          Compress-Archive -Path (Join-Path $stageDir '*') -DestinationPath $zipPath -CompressionLevel Optimal

          $hash = (Get-FileHash -Path $zipPath -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $([IO.Path]::GetFileName($zipPath))" | Set-Content -Path $checksumPath -Encoding ascii

          Add-Content -Path $env:GITHUB_ENV -Value "GATEWAY_TAG=$tag"
          Add-Content -Path $env:GITHUB_ENV -Value "GATEWAY_ASSET_BASE=$assetBase"
          Add-Content -Path $env:GITHUB_ENV -Value "GATEWAY_ZIP=$zipPath"
          Add-Content -Path $env:GITHUB_ENV -Value "GATEWAY_CHECKSUM=$checksumPath"

          Write-Host "Created $zipPath"
          Write-Host "SHA256: $hash"

      - name: Create GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          $tag = $env:TAG_NAME
          $assets = @($env:GATEWAY_ZIP, $env:GATEWAY_CHECKSUM)
          $notesPath = Join-Path $env:GITHUB_WORKSPACE 'release\notes.md'

          $notes = @"
          ## DoorMonitor Gateway $tag

          Windows 10/11 (x64) 用のゲートウェイアプリです。

          ### 使い方

          1. ``$($env:GATEWAY_ASSET_BASE).zip`` を展開します。
          2. ``DoorMonitor.Gateway.exe`` を実行します。
          3. タスクトレイの「設定...」で API ベース URL と API キーを設定します。

          設定は ``%LOCALAPPDATA%\DoorMonitor\gateway.settings.json`` に保存されます。
          署名なしの exe のため、SmartScreen の警告が表示される場合があります。

          ``*.sha256`` に SHA256 チェックサムを添付しています。
          "@
          $notes | Set-Content -Path $notesPath -Encoding utf8

          gh release view $tag --json tagName 2>$null | Out-Null
          if ($LASTEXITCODE -eq 0) {
            Write-Host "Release '$tag' already exists. Uploading assets."
            gh release upload $tag @assets --clobber
            if ($LASTEXITCODE -ne 0) {
              throw 'リリース資産のアップロードに失敗しました。'
            }
            exit 0
          }

          $createArgs = @(
            'release', 'create', $tag,
            $env:GATEWAY_ZIP,
            $env:GATEWAY_CHECKSUM,
            '--title', "DoorMonitor Gateway $tag",
            '--notes-file', $notesPath,
            '--verify-tag'
          )
          if ($tag -match '-') {
            $createArgs += '--prerelease'
          }

          gh @createArgs
          if ($LASTEXITCODE -ne 0) {
            throw 'GitHub Release の作成に失敗しました。'
          }
