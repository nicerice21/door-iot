name: Release Gateway

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  windows:
    name: Windows (win-x64)
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Test
        run: |
          dotnet test tests\DoorMonitor.Core.Tests\DoorMonitor.Core.Tests.csproj -c Release
          dotnet test tests\DoorMonitor.Gateway.Tests\DoorMonitor.Gateway.Tests.csproj -c Release

      - name: Publish and package
        shell: pwsh
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          $root = $env:GITHUB_WORKSPACE
          $tag = $env:TAG_NAME
          $version = $tag.TrimStart('v')
          $safeTag = $tag -replace '[^0-9A-Za-z._-]', '-'
          $assetBase = "DoorMonitor.Gateway-$safeTag-win-x64"

          $releaseDir = Join-Path $root 'release'
          $publishDir = Join-Path $releaseDir 'publish'
          $stageDir = Join-Path $releaseDir 'stage'
          $zipPath = Join-Path $releaseDir "$assetBase.zip"
          $checksumPath = Join-Path $releaseDir "$assetBase.sha256"

          Remove-Item -Recurse -Force $releaseDir -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path $publishDir, $stageDir | Out-Null

          $publishArgs = @(
            'publish',
            'src\DoorMonitor.Gateway',
            '-p:PublishProfile=win-x64',
            '-p:DebugType=None',
            '-p:DebugSymbols=false',
            '-o', $publishDir
          )

          if ($version -match '^\d+\.\d+\.\d+(\.\d+)?$') {
            $publishArgs += "-p:Version=$version"
          }
          else {
            Write-Warning "タグ '$tag' は vX.Y.Z 形式ではないため、アセンブリのバージョンは既定値になります。"
          }

          dotnet @publishArgs
          if ($LASTEXITCODE -ne 0) {
            throw 'dotnet publish に失敗しました。'
          }

          Copy-Item -Path (Join-Path $publishDir '*') -Destination $stageDir
          Copy-Item -Path (Join-Path $root 'LICENSE') -Destination $stageDir

          $readme = @"
          DoorMonitor Gateway $tag (Windows x64)

          Windows 10/11 (x64) 用のゲートウェイアプリです。

          1. DoorMonitor.Gateway.exe を実行します。
          2. タスクトレイの「設定...」で API ベース URL と API キーを設定します。
          3. 設定は %LOCALAPPDATA%\DoorMonitor\gateway.settings.json に保存されます。

          署名なしの exe のため、SmartScreen の警告が表示される場合があります。
          同じバージョンの Ubuntu 版は DoorMonitor.Gateway-$safeTag-linux-x64.tar.gz です。
          "@
          $readme | Set-Content -Path (Join-Path $stageDir 'README.txt') -Encoding utf8

          Compress-Archive -Path (Join-Path $stageDir '*') -DestinationPath $zipPath -CompressionLevel Optimal

          $hash = (Get-FileHash -Path $zipPath -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $([IO.Path]::GetFileName($zipPath))" | Set-Content -Path $checksumPath -Encoding ascii

          Write-Host "Created $zipPath"
          Write-Host "SHA256: $hash"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist-win-x64
          path: |
            release/*.zip
            release/*.sha256
          if-no-files-found: error

  linux:
    name: Ubuntu (linux-x64)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Test
        run: |
          dotnet test tests/DoorMonitor.Core.Tests/DoorMonitor.Core.Tests.csproj -c Release
          dotnet test tests/DoorMonitor.Gateway.Tests/DoorMonitor.Gateway.Tests.csproj -c Release

      - name: Publish and package
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          tag="$TAG_NAME"
          version="${tag#v}"
          safe_tag=$(printf '%s' "$tag" | sed 's/[^0-9A-Za-z._-]/-/g')
          asset_base="DoorMonitor.Gateway-${safe_tag}-linux-x64"

          release_dir="$PWD/release"
          publish_dir="$release_dir/publish"
          stage_dir="$release_dir/stage"
          rm -rf "$release_dir"
          mkdir -p "$publish_dir" "$stage_dir"

          args=(publish src/DoorMonitor.Gateway.Cli -p:PublishProfile=linux-x64 -p:DebugType=None -p:DebugSymbols=false -o "$publish_dir")
          if [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(\.[0-9]+)?$ ]]; then
            args+=("-p:Version=$version")
          else
            echo "::warning::タグ '$tag' は vX.Y.Z 形式ではないため、アセンブリのバージョンは既定値になります。"
          fi

          dotnet "${args[@]}"

          "$publish_dir/doormonitor-gateway" --version

          cp "$publish_dir/doormonitor-gateway" "$stage_dir/"
          cp LICENSE "$stage_dir/"
          cat > "$stage_dir/README.txt" <<EOF
          DoorMonitor Gateway $tag (Ubuntu x64)

          Ubuntu 22.04 以降 (x64) 用のヘッドレス版ゲートウェイです。

          1. tar -xzf $asset_base.tar.gz で展開します。
          2. ./doormonitor-gateway --list-ports で MONOSTICK のポートを確認します。
          3. 初回は ./doormonitor-gateway を実行すると ~/.local/share/DoorMonitor/gateway.settings.json を作成して終了します。
          4. 設定ファイルの comPort / apiBaseUrl / apiKey を編集してから再実行します。

          シリアルデバイスへアクセスするため、実行ユーザーを dialout グループへ追加してください。
          常駐させる手順はリポジトリの docs/deployment.md 6.2 を参照してください。

          同じバージョンの Windows 版は DoorMonitor.Gateway-$safe_tag-win-x64.zip です。
          EOF

          tar -czf "$release_dir/$asset_base.tar.gz" -C "$stage_dir" doormonitor-gateway README.txt LICENSE
          (cd "$release_dir" && sha256sum "$asset_base.tar.gz" > "$asset_base.sha256")

          ls -l "$release_dir"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist-linux-x64
          path: |
            release/*.tar.gz
            release/*.sha256
          if-no-files-found: error

  release:
    name: Create GitHub Release
    needs: [windows, linux]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout tag
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          tag="$TAG_NAME"
          safe_tag=$(printf '%s' "$tag" | sed 's/[^0-9A-Za-z._-]/-/g')
          mapfile -t assets < <(find dist -maxdepth 1 -type f | sort)
          printf '%s\n' "${assets[@]}"

          cat > notes.md <<EOF
          ## DoorMonitor Gateway $tag

          - Windows 10/11 (x64): \`DoorMonitor.Gateway-$safe_tag-win-x64.zip\`
          - Ubuntu 22.04 以降 (x64): \`DoorMonitor.Gateway-$safe_tag-linux-x64.tar.gz\`

          ### Windows

          1. ZIP を展開します。
          2. \`DoorMonitor.Gateway.exe\` を実行します。
          3. タスクトレイの「設定...」で API ベース URL と API キーを設定します。

          設定は \`%LOCALAPPDATA%\DoorMonitor\gateway.settings.json\` に保存されます。

          ### Ubuntu（ヘッドレス）

          \`\`\`bash
          tar -xzf DoorMonitor.Gateway-$safe_tag-linux-x64.tar.gz
          ./doormonitor-gateway --list-ports
          ./doormonitor-gateway
          # 初回は ~/.local/share/DoorMonitor/gateway.settings.json を作成して終了します。
          \`\`\`

          シリアルデバイスへアクセスするため、実行ユーザーを \`dialout\` グループへ追加してください。

          \`*.sha256\` に SHA256 チェックサムを添付しています。
          EOF

          if gh release view "$tag" --json tagName >/dev/null 2>&1; then
            echo "Release '$tag' already exists. Uploading assets."
            gh release upload "$tag" "${assets[@]}" --clobber
            exit 0
          fi

          args=(release create "$tag" --title "DoorMonitor Gateway $tag" --notes-file notes.md --verify-tag)
          args+=("${assets[@]}")
          if [[ "$tag" == *-* ]]; then
            args+=(--prerelease)
          fi

          gh "${args[@]}"
